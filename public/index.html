<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うまアプリ 馬券収支</title>
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-title" content="馬券収支">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: #e1e0d9;
  --series: #2a78d6; --pos: #2a78d6; --neg: #e34948;
  --up-text: #006300; --down-text: #d03b3b; --accent: #2a78d6; --chip: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: #2c2c2a;
    --series: #3987e5; --pos: #3987e5; --neg: #e66767;
    --up-text: #0ca30c; --down-text: #e66767; --accent: #3987e5; --chip: #2c2c2a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.6 system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--ink-2); margin: 0 0 16px; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
input, select, button { font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 10px; }
input[name=q] { width: 180px; } input[type=number] { width: 90px; }
button { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px 18px; cursor: pointer; font-weight: 600; }
button:disabled { opacity: .6; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { background: var(--chip); color: var(--ink); border: 1px solid transparent; font-weight: normal; padding: 3px 10px; font-size: 13px; }
.chip.active { border-color: var(--accent); }
.banner { display: none; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.banner.show { display: block; }
.bar { height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.error { color: var(--down-text); }
.title { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
.title small { font-weight: normal; color: var(--ink-2); font-size: 13px; margin-left: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--ink-2); }
.tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--muted); }
.tile.hero .v { font-size: 30px; }
.up { color: var(--up-text); } .down { color: var(--down-text); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; z-index: 2; }
.tip b { font-variant-numeric: tabular-nums; }
.row2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
@media (max-width: 800px) { .row2 { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
td.l, th.l { text-align: left; }
tr.hit td { background: color-mix(in srgb, var(--pos) 9%, transparent); }
tr.refund td { color: var(--muted); }
.scroll { max-height: 520px; overflow: auto; }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tabs .chip { cursor: pointer; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
#result { display: none; }
</style>
</head>
<body>
<main>
  <h1>うまアプリ 馬券収支シミュレーター</h1>
  <p class="sub">JRA 公式サイトのレース結果を元に「この条件で毎レース買っていたら？」を計算します。検索時に、まだ取得していない開催のデータを自動で取得します。</p>

  <div class="card">
    <form id="f">
      <label>対象
        <select name="kind">
          <option value="jockey">騎手</option>
          <option value="trainer">調教師</option>
          <option value="horse">馬</option>
        </select>
      </label>
      <label>名前（部分一致）<input name="q" value="ルメール" required></label>
      <label>開始日<input type="date" name="from"></label>
      <label>終了日<input type="date" name="to"></label>
      <label>券種
        <select name="bet"><option>単勝</option><option>複勝</option></select>
      </label>
      <label>1レースの購入額<input type="number" name="stake" value="100" min="100" step="100"></label>
      <button id="go">計算する</button>
    </form>
    <div class="chips" id="cands"></div>
    <div class="banner" id="banner"><span id="bannerText"></span><div class="bar"><div id="bannerBar"></div></div></div>
    <div class="note" id="dbinfo"></div>
  </div>

  <div id="result">
    <p class="title" id="rtitle"></p>
    <div class="tiles" id="tiles"></div>
    <div class="row2" style="margin-top:16px">
      <div class="card"><p class="title">累積収支</p><div class="chart" id="cumChart"></div></div>
      <div class="card">
        <div class="tabs"><span class="title" style="margin:0 8px 0 0">月別収支</span>
          <button class="chip active" data-view="chart" type="button">グラフ</button>
          <button class="chip" data-view="table" type="button">表</button></div>
        <div class="chart" id="monChart"></div>
        <div id="monTable" style="display:none"></div>
      </div>
    </div>
    <div class="card">
      <p class="title">レース一覧 <small id="rcount"></small></p>
      <div class="scroll" id="races"></div>
      <p class="note">払戻は JRA 公式の払戻金（100 円あたり）から算出。単勝オッズは公式の成績表に無いため勝ち馬のみ表示（払戻金 ÷ 100）。取消・除外は返還のため購入数に含めません（競走中止・失格はハズレ扱い）。</p>
    </div>
  </div>
</main>

<script type="module">
import { createStaticEngine, normalizeName } from './sim.js';
const $ = (s) => document.querySelector(s);
const f = $('#f');
const yen = (v) => (v < 0 ? '-' : '') + Math.abs(Math.round(v)).toLocaleString('ja-JP') + '円';
const signedYen = (v) => (v > 0 ? '+' : '') + yen(v);
const pct = (v) => (v == null ? '-' : (v * 100).toFixed(1) + '%');
const cls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : '');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let state = { selectedId: null, data: null, lastParams: null, polling: false };
// 静的版（GitHub Pages）のときは data.json を読み込んでブラウザ内で計算する。null ならローカルサーバー版。
let engine = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ローカル版は API、静的版は engine で同じ形の結果を返す
const backend = {
  candidates: async (p) => engine
    ? engine.candidates(p.kind, p.q, p.from, p.to)
    : (await api('api/candidates?' + new URLSearchParams({ kind: p.kind, q: p.q, from: p.from, to: p.to }))).candidates,
  simulate: async (p, id) => engine
    ? engine.simulate({ kind: p.kind, id, from: p.from, to: p.to, bet: p.bet, stake: p.stake })
    : api('api/simulate?' + new URLSearchParams({ kind: p.kind, id, from: p.from, to: p.to, bet: p.bet, stake: p.stake })),
};

function params() {
  const fd = new FormData(f);
  return { kind: fd.get('kind'), q: fd.get('q').trim(), from: fd.get('from'), to: fd.get('to'), bet: fd.get('bet'), stake: fd.get('stake') };
}

async function init() {
  let s = null;
  try {
    const r = await fetch('api/status');
    if (r.ok && (r.headers.get('content-type') || '').includes('json')) s = await r.json();
  } catch {}
  if (s) {
    f.from.value = s.today.slice(0, 4) + '-01-01';
    f.to.value = s.today;
    showDb(s);
    if (s.sync.running) poll();
    return;
  }
  // 静的版
  $('#dbinfo').textContent = 'データを読み込み中…';
  $('#go').disabled = true;
  try {
    const r = await fetch('data/data.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    engine = createStaticEngine(await r.json());
  } catch (e) {
    $('#dbinfo').innerHTML = `<span class="error">データを読み込めませんでした（${esc(e.message)}）</span>`;
    return;
  }
  const m = engine.meta;
  f.from.value = m.lastDate.slice(0, 4) + '-01-01';
  f.to.value = m.lastDate;
  $('.sub').textContent = 'JRA 公式サイトのレース結果を元に「この条件で毎レース買っていたら？」を計算します。データは土日・祝日の夜に自動更新されます。';
  const updated = new Date(m.generatedAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  $('#dbinfo').textContent = `データ: ${m.races.toLocaleString()} レース（${m.firstDate} 〜 ${m.lastDate}）・${updated} 更新`;
  $('#go').disabled = false;
}

function showDb(s) {
  $('#dbinfo').textContent = s.db.races
    ? `保存済み: ${s.db.races.toLocaleString()} レース（${s.db.first_date} 〜 ${s.db.last_date}）`
    : '保存済みデータはまだありません';
}

function showSync(sync) {
  const b = $('#banner');
  if (sync.running) {
    b.classList.add('show');
    const ratio = sync.daysTotal ? sync.daysDone / sync.daysTotal : 0;
    $('#bannerText').innerHTML = `データ更新中（${sync.daysDone}/${sync.daysTotal || "?"} 開催・新規 ${sync.racesFetched} レース）… ${esc(sync.waiting || sync.message)}<br>更新が終わると自動で再計算します。表示中の数字は取得済み分のみです。`;
    $('#bannerBar').style.width = (ratio * 100).toFixed(1) + '%';
  } else if (sync.phase === 'error') {
    b.classList.add('show');
    $('#bannerText').innerHTML = `<span class="error">データ取得エラー: ${esc(sync.error)}</span>（取得済みのデータで計算しています）`;
    $('#bannerBar').style.width = '0';
  } else {
    b.classList.remove('show');
  }
}

async function poll() {
  if (state.polling) return;
  state.polling = true;
  let lastFetched = -1;
  while (true) {
    const s = await api('api/status').catch(() => null);
    if (!s) break;
    showSync(s.sync); showDb(s);
    if (!s.sync.running) { if (state.lastParams) await compute(state.lastParams); break; }
    // 取得が進んだら途中経過も 15 秒おきに反映
    if (state.lastParams && s.sync.racesFetched - lastFetched >= 15) { lastFetched = s.sync.racesFetched; await compute(state.lastParams, true); }
    await new Promise((r) => setTimeout(r, 2000));
  }
  state.polling = false;
}

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = params();
  if (p.from > p.to) return alert('開始日が終了日より後になっています');
  state.selectedId = null;
  state.lastParams = p;
  $('#go').disabled = true;
  try {
    if (engine) { await compute(p); return; }
    const { sync } = await api(`api/sync?from=${p.from}&to=${p.to}`, { method: 'POST' });
    showSync(sync);
    await compute(p);
    poll();
  } catch (err) { alert(err.message); }
  finally { $('#go').disabled = false; }
});

async function compute(p, quiet) {
  const candidates = await backend.candidates(p);
  const box = $('#cands');
  if (!candidates.length) {
    box.innerHTML = `<span class="note">「${esc(p.q)}」に該当する${f.kind.selectedOptions[0].text}は見つかりませんでした${engine ? '' : '（データ取得中の場合は完了後に再検索してください）'}</span>`;
    if (!quiet) $('#result').style.display = 'none';
    return;
  }
  const norm = normalizeName(p.q);
  if (!state.selectedId || !candidates.some((c) => c.id === state.selectedId)) {
    state.selectedId = (candidates.find((c) => normalizeName(c.name) === norm) || candidates[0]).id;
  }
  box.innerHTML = candidates.length > 1
    ? '候補: ' + candidates.map((c) => `<button type="button" class="chip ${c.id === state.selectedId ? 'active' : ''}" data-id="${esc(c.id)}">${esc(c.name)}（${c.rides}）</button>`).join('')
    : '';
  const data = await backend.simulate(p, state.selectedId);
  state.data = data;
  render(data);
}

$('#cands').addEventListener('click', (e) => {
  const id = e.target.closest('[data-id]')?.dataset.id;
  if (!id || !state.lastParams) return;
  state.selectedId = id;
  compute(state.lastParams);
});

document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('active', x === b));
  const table = b.dataset.view === 'table';
  $('#monChart').style.display = table ? 'none' : '';
  $('#monTable').style.display = table ? '' : 'none';
}));

function render(d) {
  $('#result').style.display = 'block';
  const s = d.summary;
  $('#rtitle').innerHTML = `${esc(d.name)}<small>${d.kindLabel}／${d.from} 〜 ${d.to}／${d.bet} ${d.stakePerBet.toLocaleString()}円ずつ</small>`;
  $('#tiles').innerHTML = [
    ['収支', `<span class="${cls(s.profit)}">${signedYen(s.profit)}</span>`, `投資 ${yen(s.stake)} → 払戻 ${yen(s.ret)}`, 'hero'],
    ['回収率', pct(s.recovery), s.recovery == null ? '' : s.recovery >= 1 ? 'プラス収支' : 'マイナス収支'],
    ['的中率', pct(s.hitRate), `${s.hits.toLocaleString()} / ${s.bets.toLocaleString()} レース`],
    ['着別度数', `${s.first}-${s.second}-${s.third}-${s.bets - s.first - s.second - s.third}`, `返還 ${s.refunded} 件`],
    ['最高払戻', yen(s.maxPayout), '1レースあたり'],
  ].map(([k, v, dd, c]) => `<div class="tile ${c || ''}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${dd}</div></div>`).join('');
  drawCum(d);
  drawMonths(d);
  $('#monTable').innerHTML = `<table><tr><th class="l">月</th><th>購入</th><th>的中</th><th>投資</th><th>払戻</th><th>収支</th><th>回収率</th></tr>${
    d.months.map((m) => `<tr><td class="l">${m.month}</td><td>${m.bets}</td><td>${m.hits}</td><td>${yen(m.stake)}</td><td>${yen(m.ret)}</td><td class="${cls(m.profit)}">${signedYen(m.profit)}</td><td>${pct(m.recovery)}</td></tr>`).join('')}</table>`;
  $('#rcount').textContent = `${d.races.length.toLocaleString()} 件（新しい順）`;
  $('#races').innerHTML = `<table><tr><th class="l">日付</th><th class="l">場</th><th>R</th><th class="l">レース名</th><th class="l">コース</th><th class="l">馬名</th>${d.kind !== 'jockey' ? '<th class="l">騎手</th>' : ''}<th>人気</th><th>単勝</th><th>着順</th><th>払戻</th></tr>${
    d.races.map((r) => `<tr class="${r.status}"><td class="l">${r.date}</td><td class="l">${esc(r.venue)}</td><td>${r.race_no}</td><td class="l">${esc(r.race_name)}</td><td class="l">${esc(r.surface || '')}${r.distance || ''}</td><td class="l">${esc(r.horse_name)}</td>${d.kind !== 'jockey' ? `<td class="l">${esc(r.jockey_name)}</td>` : ''}<td>${r.popularity ?? '-'}</td><td>${r.odds ?? '-'}</td><td>${esc(r.finish)}${r.headcount ? `/${r.headcount}` : ''}</td><td>${r.status === 'refund' ? '返還' : r.ret ? yen(r.ret) : ''}</td></tr>`).join('')}</table>`;
}

// ---- charts ----
const NS = 'http://www.w3.org/2000/svg';
function niceTicks(min, max, n = 4) {
  const span = max - min || 1;
  const step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
  const ticks = [];
  for (let v = Math.floor(min / step) * step; v <= max + 1e-9; v += step) ticks.push(v);
  return ticks;
}
const short = (v) => {
  const a = Math.abs(v);
  return (v < 0 ? '-' : '') + (a >= 10000 ? (a / 10000).toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + '万' : a.toLocaleString('ja-JP'));
};
function frame(el, h) {
  el.innerHTML = '';
  const w = el.clientWidth || 600;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('height', h);
  el.appendChild(svg);
  const tip = document.createElement('div'); tip.className = 'tip'; el.appendChild(tip);
  return { svg, w, tip };
}
const add = (p, tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; p.appendChild(n); return n; };

function yAxis(svg, ticks, y, x0, x1) {
  for (const t of ticks) {
    add(svg, 'line', { x1: x0, x2: x1, y1: y(t), y2: y(t), stroke: t === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 });
    add(svg, 'text', { x: x0 - 6, y: y(t) + 4, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 11 }, short(t));
  }
}

function drawCum(d) {
  const el = $('#cumChart');
  const H = 260, m = { l: 52, r: 12, t: 12, b: 26 };
  const { svg, w, tip } = frame(el, H);
  const pts = [{ date: d.from, cum: 0 }, ...d.series];
  if (pts.length < 2) { add(svg, 'text', { x: w / 2, y: H / 2, 'text-anchor': 'middle', fill: 'var(--muted)' }, 'データがありません'); return; }
  const vals = pts.map((p) => p.cum);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const x = (i) => m.l + (i / (pts.length - 1)) * (w - m.l - m.r);
  const y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  yAxis(svg, ticks, y, m.l, w - m.r);
  // 月の目盛り
  let prev = '';
  pts.forEach((p, i) => {
    const ym = p.date.slice(0, 7);
    if (ym !== prev && i > 0) { add(svg, 'text', { x: x(i), y: H - 8, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 11 }, +ym.slice(5) + '月'); }
    prev = ym;
  });
  add(svg, 'path', { d: pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.cum).toFixed(1)}`).join(''), fill: 'none', stroke: 'var(--series)', 'stroke-width': 2, 'stroke-linejoin': 'round' });
  const last = pts[pts.length - 1];
  add(svg, 'circle', { cx: x(pts.length - 1), cy: y(last.cum), r: 4, fill: 'var(--series)', stroke: 'var(--surface)', 'stroke-width': 2 });
  // hover crosshair
  const cross = add(svg, 'line', { y1: m.t, y2: H - m.b, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
  const dot = add(svg, 'circle', { r: 4, fill: 'var(--series)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
  const hit = add(svg, 'rect', { x: m.l, y: m.t, width: w - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' });
  hit.addEventListener('mousemove', (e) => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) * (w / r.width);
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(((px - m.l) / (w - m.l - m.r)) * (pts.length - 1))));
    const p = pts[i];
    for (const n of [cross, dot]) n.setAttribute('visibility', 'visible');
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.cum));
    tip.innerHTML = `${p.date}${i ? `（${i}レース目）` : ''}<br>累積収支 <b class="${cls(p.cum)}">${signedYen(p.cum)}</b>`;
    tip.style.display = 'block';
    const left = (x(i) / w) * r.width;
    tip.style.left = Math.min(left + 12, r.width - tip.offsetWidth) + 'px';
    tip.style.top = '8px';
  });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); });
}

function drawMonths(d) {
  const el = $('#monChart');
  const H = 260, m = { l: 52, r: 8, t: 12, b: 26 };
  const { svg, w, tip } = frame(el, H);
  const ms = d.months;
  if (!ms.length) return;
  const vals = ms.map((x) => x.profit);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  yAxis(svg, ticks, y, m.l, w - m.r);
  const band = (w - m.l - m.r) / ms.length;
  const bw = Math.max(4, Math.min(28, band - 2));
  ms.forEach((mo, i) => {
    const cx = m.l + band * (i + 0.5);
    const top = y(Math.max(0, mo.profit)), bot = y(Math.min(0, mo.profit));
    const h = Math.max(1, bot - top), rr = Math.min(4, h / 2, bw / 2);
    const xL = cx - bw / 2, xR = cx + bw / 2;
    // データ側の端だけ角丸（基線側は直角）
    const dpath = mo.profit >= 0
      ? `M${xL},${bot}V${top + rr}Q${xL},${top} ${xL + rr},${top}H${xR - rr}Q${xR},${top} ${xR},${top + rr}V${bot}Z`
      : `M${xL},${top}V${bot - rr}Q${xL},${bot} ${xL + rr},${bot}H${xR - rr}Q${xR},${bot} ${xR},${bot - rr}V${top}Z`;
    add(svg, 'path', { d: dpath, fill: mo.profit >= 0 ? 'var(--pos)' : 'var(--neg)' });
    add(svg, 'text', { x: cx, y: H - 8, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 11 }, +mo.month.slice(5) + '月');
    const hit = add(svg, 'rect', { x: cx - band / 2, y: m.t, width: band, height: H - m.t - m.b, fill: 'transparent' });
    hit.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect();
      tip.innerHTML = `${mo.month}<br>収支 <b class="${cls(mo.profit)}">${signedYen(mo.profit)}</b><br>回収率 ${pct(mo.recovery)}／的中 ${mo.hits}/${mo.bets}`;
      tip.style.display = 'block';
      tip.style.left = Math.min((cx / w) * r.width + 10, r.width - tip.offsetWidth) + 'px';
      tip.style.top = '8px';
    });
    hit.addEventListener('mouseleave', () => (tip.style.display = 'none'));
  });
}

let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => state.data && render(state.data), 150); });
init();
</script>
